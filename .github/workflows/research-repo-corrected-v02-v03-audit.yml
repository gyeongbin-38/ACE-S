name: research-repo-corrected-v02-v03-audit

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-repo-corrected-v02-v03-audit.yml
      - scripts/audit_corrected_repo_evidence_v02_v03.py
      - scripts/audit_corrected_repo_evidence_v02_v03_fix.py

jobs:
  audit-corrected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACE_S_REPO_CACHE: /tmp/ace-s-repo-cache
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Re-score v0.2 and v0.3 with corrected ground truth
        run: python scripts/audit_corrected_repo_evidence_v02_v03_fix.py
