name: validate-generic-candidate-holdout

on:
  push:
    branches:
      - eval/generic-candidate-unseen-v04
  pull_request:
    paths:
      - "benchmarks/FROZEN_GENERIC_CANDIDATE_V04.json"
      - "benchmarks/generic-candidate-unseen-v0.1.json"
      - "scripts/score_generic_candidate_holdout.py"
      - "scripts/validate_generic_candidate_freeze.py"
      - ".github/workflows/validate-generic-candidate-holdout.yml"

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enforce candidate freeze
        run: python scripts/validate_generic_candidate_freeze.py
      - name: Score fresh structural holdout
        run: python scripts/score_generic_candidate_holdout.py
