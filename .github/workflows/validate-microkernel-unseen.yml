name: validate-microkernel-unseen

on:
  push:
    branches:
      - eval/microkernel-unseen-v04
  pull_request:

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enforce microkernel policy freeze
        run: python scripts/validate_microkernel_freeze.py
      - name: Validate microkernel runtime
        run: python scripts/validate_microkernel_runtime.py
      - name: Score sealed external microkernel holdout
        run: python scripts/score_microkernel_unseen.py
