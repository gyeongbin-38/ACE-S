name: research-risk-control

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-risk-control.yml
      - scripts/discover_risk_controlled_racing.py

env:
  PYTHONHASHSEED: "0"

jobs:
  risk-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Calibrate catastrophic-risk-controlled racing policy
        run: python scripts/discover_risk_controlled_racing.py
