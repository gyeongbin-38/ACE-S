name: research-certificate

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-certificate.yml
      - scripts/discover_evidence_certificate_bench.py
      - scripts/discover_certificate_call_penalty.py
      - scripts/run_typed_evidence_certificate_sealed.py
      - benchmarks/TYPED_EVIDENCE_CERTIFICATE_FREEZE_V0.1.md

env:
  PYTHONHASHSEED: "0"

jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run sealed typed evidence certificate OOD test
        run: python scripts/run_typed_evidence_certificate_sealed.py
