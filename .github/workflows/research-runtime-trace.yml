name: research-runtime-trace

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-runtime-trace.yml
      - scripts/validate_runtime_trace.py
      - scripts/summarize_runtime_trace.py
      - scripts/compare_runtime_ab.py
      - scripts/compare_runtime_ab_suite.py
      - scripts/runtime_trace_writer.py
      - scripts/validate_runtime_taskset.py
      - scripts/run_runtime_ab_harness.py
      - scripts/fake_runtime_adapter.py
      - benchmarks/runtime-traces/**

env:
  PYTHONHASHSEED: "0"

jobs:
  runtime-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate frozen real-repo runtime pilot taskset
        run: python scripts/validate_runtime_taskset.py benchmarks/runtime-traces/pilots/repo-localization-v0.1.json
      - name: Smoke-test TraceWriter output
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from runtime_trace_writer import TraceWriter, metric
          p = Path("/tmp/ace-s-writer-smoke.jsonl")
          w = TraceWriter(p, "writer-smoke-001", "ON", "ci-fixture", "fixture-model", "repository-local")
          w.tool_call_start("c1", "fixture.lookup")
          w.tool_call_end("c1", True, 3.0)
          digest = w.evidence_observed(
              "ev1",
              evidence_kind="structured",
              certificate_capable=True,
              provenance_refs=["fixture://source/1"],
              exact_value={"value": 7},
              metrics={"controller_only_bytes": metric(32), "controller_only_tokens": metric(None)},
          )
          assert digest is not None
          w.certificate_emitted(
              "cert1", "ev1", schema_ref="schema://fixture/v1",
              exact_value_sha256=digest, provenance_refs=["fixture://source/1"],
              metrics={"certificate_bytes": metric(12), "certificate_tokens": metric(None)},
          )
          w.expose_certificate("cert1", bytes_=12, tokens=None)
          w.end(passed=True, quality_score=1.0, wall_clock_ms=5.0)
          PY
          python scripts/validate_runtime_trace.py /tmp/ace-s-writer-smoke.jsonl
      - name: Validate structured certificate trace
        run: python scripts/validate_runtime_trace.py benchmarks/runtime-traces/fixtures/valid-structured-certificate.jsonl
      - name: Reject semantic certificate trace
        run: |
          if python scripts/validate_runtime_trace.py benchmarks/runtime-traces/fixtures/invalid-semantic-certificate.jsonl; then
            echo "invalid semantic certificate unexpectedly passed"
            exit 1
          fi
          echo "semantic certificate correctly rejected"
      - name: Summarize valid trace
        run: python scripts/summarize_runtime_trace.py benchmarks/runtime-traces/fixtures/valid-structured-certificate.jsonl
      - name: Validate paired OFF trace
        run: python scripts/validate_runtime_trace.py benchmarks/runtime-traces/fixtures/paired-off.jsonl
      - name: Validate paired ON trace
        run: python scripts/validate_runtime_trace.py benchmarks/runtime-traces/fixtures/paired-on.jsonl
      - name: Require paired A/B quality-preserving efficiency pass
        run: >-
          python scripts/compare_runtime_ab.py
          benchmarks/runtime-traces/fixtures/paired-off.jsonl
          benchmarks/runtime-traces/fixtures/paired-on.jsonl
          --require-pass
      - name: Reject efficiency win with quality regression
        run: |
          if python scripts/compare_runtime_ab.py \
            benchmarks/runtime-traces/fixtures/paired-off.jsonl \
            benchmarks/runtime-traces/fixtures/paired-on-quality-regression.jsonl \
            --require-pass; then
            echo "quality-regressed ON trace unexpectedly passed paired gate"
            exit 1
          fi
          echo "quality regression correctly rejected"
      - name: Require passing paired A/B suite
        run: >-
          python scripts/compare_runtime_ab_suite.py
          benchmarks/runtime-traces/fixtures/paired-suite-pass.json
          --require-pass
      - name: Reject suite with per-task quality regression
        run: |
          if python scripts/compare_runtime_ab_suite.py \
            benchmarks/runtime-traces/fixtures/paired-suite-quality-regression.json \
            --require-pass; then
            echo "quality-regressed suite unexpectedly passed"
            exit 1
          fi
          echo "quality-regressed suite correctly rejected"
      - name: Exercise ground-truth-isolated external adapter harness
        run: >-
          python scripts/run_runtime_ab_harness.py
          benchmarks/runtime-traces/fixtures/harness-taskset.json
          --adapter "python scripts/fake_runtime_adapter.py"
          --out-dir /tmp/ace-s-runtime-harness
          --require-pass
