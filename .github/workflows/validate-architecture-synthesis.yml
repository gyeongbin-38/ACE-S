name: validate-architecture-synthesis

on:
  push:
    branches:
      - exp/architecture-synthesis-v01
    paths:
      - 'skills/architecture-engineering/**'
      - 'benchmarks/architecture-*'
      - 'scripts/*architecture*'
      - '.github/workflows/validate-architecture-synthesis.yml'
  pull_request:
    paths:
      - 'skills/architecture-engineering/**'
      - 'benchmarks/architecture-*'
      - 'scripts/*architecture*'
      - '.github/workflows/validate-architecture-synthesis.yml'

env:
  PYTHONHASHSEED: "0"

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Architecture Skill progressive loading
        run: python scripts/validate_architecture_skill.py
      - name: Run architecture contract benchmark
        run: python scripts/run_architecture_contract_bench.py
      - name: Run architecture Pareto frontier benchmark
        run: python scripts/run_architecture_frontier_bench.py
      - name: Run architecture state-graph mutation benchmark
        run: python scripts/run_architecture_graph_mutation_bench.py
      - name: Run incremental architecture impact benchmark
        run: python scripts/run_architecture_impact_bench.py
      - name: Run architecture uncertainty benchmark
        run: python scripts/run_architecture_uncertainty_bench.py
      - name: Run counterfactual architecture delta benchmark
        run: python scripts/run_architecture_delta_bench.py
      - name: Run normalized architecture relation metrics benchmark
        run: python scripts/run_architecture_structural_metrics_bench.py
      - name: Run architecture claim promotion gate benchmark
        run: python scripts/run_architecture_claim_gate_bench.py
      - name: Run architecture value-of-information benchmark
        run: python scripts/run_architecture_voi_bench.py
      - name: Run architecture evaluation freeze-bundle benchmark
        run: python scripts/run_architecture_eval_bundle_bench.py
      - name: Run architecture constraint-ledger benchmark
        run: python scripts/run_architecture_constraint_ledger_bench.py
