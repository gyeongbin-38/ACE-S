name: research-racing

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-racing.yml
      - scripts/discover_sequential_rollout_racing.py
      - scripts/discover_sequential_rollout_racing_v2.py

env:
  PYTHONHASHSEED: "0"

jobs:
  racing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tail-safe sequential rollout racing development search
        run: python scripts/discover_sequential_rollout_racing_v2.py
