name: research-racing

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-racing.yml
      - scripts/discover_sequential_rollout_racing.py
      - scripts/discover_sequential_rollout_racing_v2.py
      - scripts/discover_sequential_rollout_racing_v3.py
      - scripts/run_sequential_rollout_racing_v3_sealed.py
      - benchmarks/SEQUENTIAL_RACING_FREEZE_V0.3.md

env:
  PYTHONHASHSEED: "0"

jobs:
  racing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run sealed catastrophic-tail-safe racing v3 OOD test
        run: python scripts/run_sequential_rollout_racing_v3_sealed.py
