name: research-repo-behavior-witness-multiscale-v053

on:
  push:
    branches:
      - exp/behavior-witness-minimality-v05
    paths:
      - benchmarks/runtime-traces/pilots/repo-behavior-witness-development-v0.5.json
      - scripts/search_repo_behavior_witness_multiscale_v053.py
      - scripts/search_repo_behavior_witness_minimality_v05.py
      - scripts/discover_repo_behavior_windows_v03.py
      - scripts/discover_repo_frontier_v02.py
      - adapters/deterministic_repo_localization.py
      - adapters/deterministic_repo_localization_v03.py
      - adapters/deterministic_repo_localization_v041.py
      - scripts/run_repo_candidate_frontier_dev_v2.py
      - .github/workflows/research-repo-behavior-witness-multiscale-v053.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiscale-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ACE-S repository
        run: |
          set -euo pipefail
          python scripts/validate_skill.py
          python scripts/validate_benchmarks.py
      - name: Run same-witness multi-scale pure Behavior Window grid
        run: |
          set -euo pipefail
          python scripts/search_repo_behavior_witness_multiscale_v053.py > /tmp/behavior-witness-multiscale-v053.json
          python - <<'PY'
          import json
          p = '/tmp/behavior-witness-multiscale-v053.json'
          data = json.load(open(p, encoding='utf-8'))
          assert data['tasks'] == 14
          assert data['candidate_policies'] == 105
          print('CANDIDATE_POLICIES=', data['candidate_policies'])
          print('ELIGIBLE_POLICIES=', data['eligible_policies'])
          print('SELECTED=', json.dumps(data['selected'], sort_keys=True))
          if data['selected'] is not None:
              failed = [r['task_id'] for r in data['selected_task_rows'] if not (r['frontier_hit'] and r['witness_hit'])]
              print('SELECTED_FAILURES=', failed)
              assert not failed
              assert data['selected']['false_direct'] == 0
          else:
              print('NO_POLICY_PASSED_HARD_GATE=1')
              for row in data['nearest_policies'][:5]:
                  print('NEAR=', json.dumps(row, sort_keys=True))
          PY
      - name: Record dependency closure
        run: |
          set -euo pipefail
          out=/tmp/dependency-closure-multiscale-v053.txt
          : > "$out"
          echo "head=$(git rev-parse HEAD)" >> "$out"
          for p in \
            benchmarks/runtime-traces/pilots/repo-behavior-witness-development-v0.5.json \
            scripts/search_repo_behavior_witness_multiscale_v053.py \
            scripts/search_repo_behavior_witness_minimality_v05.py \
            scripts/discover_repo_behavior_windows_v03.py \
            scripts/discover_repo_frontier_v02.py \
            adapters/deterministic_repo_localization.py \
            adapters/deterministic_repo_localization_v03.py \
            adapters/deterministic_repo_localization_v041.py \
            scripts/run_repo_candidate_frontier_dev_v2.py; do
            printf '%s=' "$p" >> "$out"
            git rev-parse "HEAD:$p" >> "$out"
          done
          python --version >> "$out"
          cat "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: behavior-witness-multiscale-v053
          path: |
            /tmp/behavior-witness-multiscale-v053.json
            /tmp/dependency-closure-multiscale-v053.txt
          if-no-files-found: error
