name: research-agreement-sealed

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-agreement-sealed.yml
      - scripts/discover_agreement_adaptive_rollout.py
      - scripts/run_agreement_adaptive_rollout_sealed.py
      - benchmarks/AGREEMENT_ADAPTIVE_FREEZE_V0.1.md

env:
  PYTHONHASHSEED: "0"

jobs:
  agreement-sealed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run frozen agreement-adaptive sealed OOD regression
        run: python scripts/run_agreement_adaptive_rollout_sealed.py
