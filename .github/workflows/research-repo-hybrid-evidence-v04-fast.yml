name: research-repo-hybrid-evidence-v04-fast

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-repo-hybrid-evidence-v04-fast.yml
      - scripts/diagnose_repo_hybrid_evidence_v04.py

jobs:
  diagnose-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACE_S_REPO_CACHE: /tmp/ace-s-repo-cache
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run fast hybrid evidence diagnostic
        run: python scripts/diagnose_repo_hybrid_evidence_v04.py
