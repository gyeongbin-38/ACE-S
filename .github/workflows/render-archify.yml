name: render-archify

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/archify/*.json"
      - ".github/workflows/render-archify.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ACE-S
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch Archify
        run: git clone --depth 1 https://github.com/tt-a1i/archify.git "$RUNNER_TEMP/archify-src"

      - name: Install Archify dependencies
        working-directory: ${{ runner.temp }}/archify-src/archify
        run: npm ci

      - name: Validate showcase architecture
        working-directory: ${{ runner.temp }}/archify-src/archify
        run: |
          node bin/archify.mjs validate architecture \
            "$GITHUB_WORKSPACE/docs/archify/ace-s.architecture.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --quality showcase \
            --json

      - name: Deliver deterministic Archify HTML
        working-directory: ${{ runner.temp }}/archify-src/archify
        run: |
          node bin/archify.mjs deliver architecture \
            "$GITHUB_WORKSPACE/docs/archify/ace-s.architecture.json" \
            "$GITHUB_WORKSPACE/docs/archify/ace-s.architecture.html" \
            --repo-root "$GITHUB_WORKSPACE" \
            --quality showcase \
            --json | tee "$GITHUB_WORKSPACE/docs/archify/ace-s.architecture.receipt.json"

      - name: Capture README preview
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No headless Chrome executable found on runner." >&2
            exit 1
          fi
          # Keep the 1200px share-card width, but give the Archify canvas enough
          # vertical room to render the complete 970x700 diagram without clipping.
          "$CHROME" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --window-size=1200,820 \
            --virtual-time-budget=2500 \
            --screenshot="$GITHUB_WORKSPACE/docs/archify/ace-s.architecture.png" \
            "file://$GITHUB_WORKSPACE/docs/archify/ace-s.architecture.html?embed=1&theme=dark"

      - name: Commit generated artifacts
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/archify/ace-s.architecture.html \
            docs/archify/ace-s.architecture.receipt.json \
            docs/archify/ace-s.architecture.png
          if git diff --cached --quiet; then
            echo "Archify artifacts are unchanged."
          else
            git commit -m "docs: render ACE-S Archify architecture"
            # A README or documentation commit may land while rendering. Rebase
            # the generated-artifact commit before pushing instead of failing.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
