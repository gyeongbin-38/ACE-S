name: validate-unseen-holdout

on:
  push:
    branches:
      - eval/unseen-routing-v04
  pull_request:
    paths:
      - "benchmarks/FROZEN_CONTROLLER_V04.json"
      - "benchmarks/unseen-routing-v0.1.json"
      - "benchmarks/external-taxonomy-expansion-v0.2.json"
      - "benchmarks/UNSEEN_ROUTING_PROTOCOL.md"
      - "benchmarks/UNSEEN_ROUTING_RESULTS_V0.1.md"
      - "benchmarks/EXTERNAL_TAXONOMY_COVERAGE_V0.2.md"
      - "benchmarks/results/unseen-routing-v0.1-gpt-5.6-sol-single-run.json"
      - "scripts/score_unseen_routing.py"
      - "scripts/score_external_taxonomy_coverage.py"
      - "scripts/validate_unseen_holdout_freeze.py"
      - ".github/workflows/validate-unseen-holdout.yml"

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enforce controller freeze
        run: python scripts/validate_unseen_holdout_freeze.py
      - name: Score single-run sanity predictions
        run: >-
          python scripts/score_unseen_routing.py
          benchmarks/results/unseen-routing-v0.1-gpt-5.6-sol-single-run.json
      - name: Score 40-task structural taxonomy stress
        run: python scripts/score_external_taxonomy_coverage.py
