name: research-repo-hybrid-evidence-v04-corrected

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-repo-hybrid-evidence-v04-corrected.yml
      - scripts/discover_repo_hybrid_evidence_v04_corrected.py
      - benchmarks/runtime-traces/pilots/repo-evidence-dev-v0.3-corrected.json

jobs:
  discover-v04-corrected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACE_S_REPO_CACHE: /tmp/ace-s-repo-cache
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run corrected-ground-truth hybrid evidence search
        run: python scripts/discover_repo_hybrid_evidence_v04_corrected.py
