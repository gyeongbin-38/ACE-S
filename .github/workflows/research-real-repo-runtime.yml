name: research-real-repo-runtime

on:
  push:
    branches:
      - exp/adaptive-context-scheduler-v04
    paths:
      - .github/workflows/research-real-repo-runtime.yml
      - adapters/deterministic_repo_localization.py
      - adapters/deterministic_repo_localization_v02.py
      - adapters/deterministic_repo_localization_v03.py
      - adapters/deterministic_repo_localization_v031.py
      - adapters/deterministic_repo_localization_v04.py
      - adapters/deterministic_repo_localization_v041.py
      - scripts/run_runtime_ab_harness.py
      - scripts/compare_runtime_ab.py
      - scripts/compare_runtime_ab_suite.py
      - scripts/runtime_trace_writer.py
      - scripts/validate_runtime_trace.py
      - scripts/validate_runtime_taskset.py
      - benchmarks/runtime-traces/pilots/repo-localization-v0.1.json

jobs:
  real-repo-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run development real-repository OFF/ON localization pilot
        run: |
          python scripts/run_runtime_ab_harness.py \
            benchmarks/runtime-traces/pilots/repo-localization-v0.1.json \
            --adapter "python adapters/deterministic_repo_localization_v041.py" \
            --out-dir /tmp/ace-s-real-runtime-v0.1 \
            --quality-tolerance 0 \
            --material-improvement-pct 1 \
            --require-pass
      - name: Report development accuracy; require at least 5 of 6
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/ace-s-real-runtime-v0.1/report.json')
          r=json.loads(p.read_text())
          off=[x for x in r['raw_scored_results'] if x['condition']=='OFF']
          correct=sum(bool(x['passed']) for x in off)
          bad=[x for x in off if not x['passed']]
          print(json.dumps({'status':'development_accuracy','correct':correct,'total':len(off),'bad':bad}, indent=2))
          if correct < 5:
              raise SystemExit(1)
          PY
