name: validate-ace-s

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Agent Skill structure
        run: python scripts/validate_skill.py
      - name: Validate RouterBench fixtures
        run: python scripts/validate_routerbench.py
      - name: Run legacy RouterBench policy experiment
        run: python scripts/run_routerbench_experiment_v2.py
      - name: Run Selective Policy Load Bench
        run: python scripts/run_policy_load_bench.py
      - name: Validate benchmark invariants
        run: python scripts/validate_benchmarks.py
