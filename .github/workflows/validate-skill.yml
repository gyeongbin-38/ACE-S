name: validate-ace-s

on:
  push:
    branches-ignore:
      - exp/architecture-synthesis-v01
  pull_request:

env:
  PYTHONHASHSEED: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Agent Skill structure
        run: python scripts/validate_skill.py
      - name: Validate Architecture Skill progressive loading
        run: python scripts/validate_architecture_skill.py
      - name: Validate Microkernel Runtime
        run: python scripts/validate_microkernel_runtime.py
      - name: Validate RouterBench fixtures
        run: python scripts/validate_routerbench.py
      - name: Run sealed retention rollout OOD regression
        run: python scripts/run_retention_rollout_sealed.py
      - name: Run refined selective retention lookahead development search
        run: python scripts/discover_selective_retention_lookahead_v2.py
      - name: Run sealed context action dominance regression
        run: python scripts/run_context_action_dominance_sealed.py
      - name: Run action-agreement negative regression
        run: python scripts/run_agreement_adaptive_rollout_sealed.py
      - name: Run tail-gated sequential rollout racing development search
        run: python scripts/discover_sequential_rollout_racing_v2.py
      - name: Run evidence certificate call-penalty sensitivity
        run: python scripts/discover_certificate_call_penalty.py
      - name: Validate benchmark invariants
        run: python scripts/validate_benchmarks.py
      - name: Run architecture contract benchmark
        run: python scripts/run_architecture_contract_bench.py
      - name: Run architecture Pareto frontier benchmark
        run: python scripts/run_architecture_frontier_bench.py
      - name: Run architecture state-graph mutation benchmark
        run: python scripts/run_architecture_graph_mutation_bench.py
