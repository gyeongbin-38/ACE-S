name: validate-ace-s

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Agent Skill structure
        run: python scripts/validate_skill.py
      - name: Validate Microkernel Runtime
        run: python scripts/validate_microkernel_runtime.py
      - name: Validate RouterBench fixtures
        run: python scripts/validate_routerbench.py
      - name: Run legacy RouterBench policy experiment
        run: python scripts/run_routerbench_experiment_v2.py
      - name: Run Selective Policy Load Bench
        run: python scripts/run_policy_load_bench.py
      - name: Run Specialization Gate Bench
        run: python scripts/run_specialization_gate_bench.py
      - name: Run Microkernel Control Exposure Bench
        run: python scripts/run_microkernel_bench.py
      - name: Run Information-Value Acquisition Bench
        run: python scripts/run_information_value_bench.py
      - name: Run Value Robustness Bench
        run: python scripts/run_value_robustness_bench.py
      - name: Run symbolic acquisition-policy discovery
        run: python scripts/discover_context_acquisition_policy.py
      - name: Validate benchmark invariants
        run: python scripts/validate_benchmarks.py
