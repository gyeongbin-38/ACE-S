name: validate-ace-s

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Agent Skill structure
        run: python scripts/validate_skill.py
      - name: Validate Microkernel Runtime
        run: python scripts/validate_microkernel_runtime.py
      - name: Validate RouterBench fixtures
        run: python scripts/validate_routerbench.py
      - name: Run Microkernel Control Exposure Bench
        run: python scripts/run_microkernel_bench.py
      - name: Run bounded adaptive resolution scheduler search
        run: python scripts/discover_resolution_scheduler_fast.py
      - name: Run lifecycle retention scheduler search
        run: python scripts/discover_retention_scheduler.py
      - name: Validate benchmark invariants
        run: python scripts/validate_benchmarks.py
